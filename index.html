<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한영 전사기</title>
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #1f6feb; --rec: #e5484d; --ko: #0e9f6e; --en: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b21; --text: #e8eaee; --muted: #9aa1ad; --line: #2a2f38;
      --accent: #4c8dff; --rec: #ff6369; --ko: #34d399; --en: #a78bfa;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { padding: 14px 16px 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  header h1 { font-size: 18px; margin: 0; flex: 1 0 100%; }
  header select { flex: 1 1 calc(50% - 4px); min-width: 0; }
  select, button { font: inherit; color: inherit; }
  select {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: 14px;
  }
  #status { padding: 0 16px 8px; font-size: 13px; color: var(--muted); min-height: 1.6em; }
  #bar { height: 3px; background: var(--line); margin: 0 16px 8px; border-radius: 3px; overflow: hidden; display: none; }
  #bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #transcript {
    flex: 1; overflow-y: auto; margin: 0 16px; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  }
  #transcript:empty::before {
    content: "아래 버튼을 눌러 녹음을 시작하세요.\A 말하는 동안 빠른 전사가 바로 보이고, 녹음을 멈추면 더 정확한 모델로 30초씩 다시 전사해 바꿔 줘요.\A 한국어/영어는 자동으로 감지돼요.\A 틀린 줄은 눌러서 고치면, 고친 말을 기억했다가 다음 전사에 반영해요.";
    white-space: pre-wrap; color: var(--muted);
  }
  .line { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .line:last-child { border-bottom: 0; }
  .meta { flex: none; width: 46px; font-size: 12px; color: var(--muted); padding-top: 3px; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px; color: #fff; margin-top: 2px; }
  .badge.ko { background: var(--ko); } .badge.en { background: var(--en); }
  .text { flex: 1; word-break: keep-all; overflow-wrap: anywhere; }
  .pending .text { color: var(--muted); font-style: italic; }
  /* 실시간 결과(초안)는 흐리게, 정밀 전사 중인 줄은 점선으로 표시 */
  .line.draft .text { color: var(--muted); }
  .line.refining .text { color: var(--muted); border-left: 2px dashed var(--accent); padding-left: 8px; }
  /* 줄을 눌러 고치기 */
  .line:not(.pending) .text { cursor: text; }
  .line.edited .text { text-decoration: underline dotted var(--accent); text-underline-offset: 4px; }
  .line textarea {
    flex: 1; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--accent);
    border-radius: 8px; padding: 4px 6px; resize: vertical; min-height: 3em;
  }
  .edit-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
  /* 고친 말 목록 */
  dialog {
    width: min(520px, calc(100vw - 32px)); max-height: 80vh; border: 1px solid var(--line); border-radius: 14px;
    background: var(--card); color: var(--text); padding: 14px 16px;
  }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  dialog h2 { font-size: 16px; margin: 0 0 4px; }
  dialog p { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  #learnList { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 50vh; }
  #learnList li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  #learnList .pair { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #learnList .from { color: var(--muted); text-decoration: line-through; }
  #learnList .n { font-size: 12px; color: var(--muted); flex: none; }
  #learnList:empty::before { content: "아직 고친 말이 없어요. 전사된 줄을 눌러 고치면 여기에 쌓여요."; color: var(--muted); font-size: 13px; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  dialog button { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  #learnList button { padding: 2px 8px; }
  /* 재생 막대와 노래방식 강조 */
  #player { display: flex; align-items: center; gap: 8px; margin: 0 16px 8px; padding: 6px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  #player[hidden] { display: none; }
  #player #play { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
  #player input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  #player #ptime { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #player select { flex: none; padding: 3px 4px; font-size: 12px; }
  .line.now { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; }
  .line.now .text { color: var(--muted); }
  .line.now .text span.sung { color: var(--text); font-weight: 600; }
  .line .meta { cursor: pointer; }
  .edit-hint button { margin-right: 6px; font-size: 12px; padding: 2px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: inherit; cursor: pointer; }
  #recList { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 55vh; }
  #recList li { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  #recList .info { flex: 1; min-width: 0; }
  #recList .dur { font-size: 12px; color: var(--muted); }
  #recList .preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #recList .acts { display: flex; flex-direction: column; gap: 4px; flex: none; }
  #recList .acts button { padding: 2px 8px; }
  #recList:empty::before { content: "아직 녹음이 없어요."; color: var(--muted); font-size: 13px; }
  #learnList .cat { min-width: 2.5em; text-align: right; }
  dialog .add { display: flex; gap: 6px; margin-bottom: 8px; }
  dialog .add input { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 5px 8px; }
  footer { padding: 12px 16px 16px; display: flex; align-items: center; gap: 10px; }
  #rec {
    flex: none; width: 68px; height: 68px; border-radius: 50%; border: 0; background: var(--rec);
    color: #fff; display: grid; place-items: center; box-shadow: 0 4px 14px rgb(0 0 0 / .18);
  }
  #rec:disabled { opacity: .45; }
  #rec .sq { width: 22px; height: 22px; border-radius: 5px; background: #fff; display: none; }
  #rec .dot { width: 26px; height: 26px; border-radius: 50%; background: #fff; }
  #rec.on .sq { display: block; } #rec.on .dot { display: none; }
  #rec.on { animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgb(229 72 77 / .18); } }
  .side { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #timer { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; }
  #meter { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
  #meter > div { height: 100%; width: 0; background: var(--ko); transition: width .08s; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .tools button, .tools label {
    background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; font-size: 13px; cursor: pointer;
  }
  .tools button:disabled { opacity: .4; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<header>
  <h1>한영 전사기</h1>
  <select id="lang" aria-label="언어">
    <option value="auto">자동 감지</option>
    <option value="ko">한국어만</option>
    <option value="en">영어만</option>
  </select>
  <select id="model" aria-label="모델">
    <option value="onnx-community/whisper-tiny">빠름 (tiny)</option>
    <option value="onnx-community/whisper-base" selected>보통 (base)</option>
    <option value="onnx-community/whisper-small">정확 (small · 느림)</option>
  </select>
  <select id="device" aria-label="처리 방식">
    <option value="auto">GPU</option>
    <option value="wasm">CPU</option>
  </select>
  <select id="precise" aria-label="녹음 후 정밀 전사">
    <option value="auto" selected>정밀 전사 (자동)</option>
    <option value="onnx-community/whisper-small">정밀 전사 (small)</option>
    <option value="onnx-community/whisper-base">정밀 전사 (base)</option>
    <option value="off">정밀 전사 끄기</option>
  </select>
  <select id="category" aria-label="상황">
    <option value="auto">상황: 자동</option>
    <option value="church">상황: 교회 · 예배</option>
    <option value="hospital">상황: 병원 · 진료</option>
    <option value="meeting">상황: 회의 · 업무</option>
    <option value="class">상황: 수업 · 강의</option>
    <option value="none">상황: 구분 안 함</option>
  </select>
</header>
<div id="status">모델 준비 중…</div>
<div id="bar"><div></div></div>
<div id="player" hidden>
  <button id="play" aria-label="재생">▶</button>
  <input id="pseek" type="range" min="0" max="1" step="0.1" value="0" aria-label="재생 위치">
  <span id="ptime">00:00 / 00:00</span>
  <select id="prate" aria-label="재생 속도"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select>
  <audio id="audio" preload="auto"></audio>
</div>
<main id="transcript"></main>
<footer>
  <button id="rec" disabled aria-label="녹음"><span class="dot"></span><span class="sq"></span></button>
  <div class="side">
    <div id="timer">00:00</div>
    <div id="meter"><div></div></div>
    <div class="tools">
      <button id="copy" disabled>복사</button>
      <button id="saveTxt" disabled>텍스트 저장</button>
      <button id="saveAudio" disabled>녹음 파일 저장</button>
      <button id="recBtn">녹음 목록</button>
      <label id="fileLabel">파일 전사<input id="file" type="file" accept="audio/*,video/*"></label>
      <button id="learnBtn">고친 말</button>
      <button id="clear">지우기</button>
    </div>
  </div>
</footer>

<dialog id="recDlg">
  <h2>녹음 목록</h2>
  <p>녹음과 전사는 이 기기의 브라우저에 자동으로 보관돼요. 열면 노래방처럼 소리에 맞춰 전사 줄이 따라가요.</p>
  <ul id="recList"></ul>
  <div class="row"><button id="recClose">닫기</button></div>
</dialog>

<dialog id="learnDlg">
  <h2>고친 말</h2>
  <p>전사된 줄을 눌러 고치면, 잘못 들린 말과 고친 말이 여기에 기록돼요.
     다음부터는 고친 말을 전사 엔진에 힌트로 주고, 같은 글자로 잘못 들리면 자동으로 바꿔요.
     고른 상황(또는 자동으로 알아낸 상황)의 어휘도 함께 힌트로 줘요.</p>
  <form id="learnAdd" class="add">
    <input id="learnWord" placeholder="자주 나오는 이름·용어 미리 넣기 (예: 요기이소)" autocomplete="off">
    <button>넣기</button>
  </form>
  <ul id="learnList"></ul>
  <div class="row">
    <button id="learnClear">모두 지우기</button>
    <button id="learnClose">닫기</button>
  </div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const statusEl = $('#status'), barEl = $('#bar'), barFill = $('#bar > div');
const transcriptEl = $('#transcript'), recBtn = $('#rec'), timerEl = $('#timer'), meterFill = $('#meter > div');
const SR = 16000;

const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ---------- 워커 ----------
// 워커 2개를 쓴다.
//  - 실시간(live): 말이 끊길 때마다 짧은 구간을 빠른 모델로 바로 전사해 초안으로 보여 준다.
//  - 정밀(precise): 녹음을 멈추면 같은 언어로 이어진 구간들을 최대 28초로 묶어 더 큰 모델로 다시 전사하고,
//    해당 초안 줄들을 결과로 바꾼다. 짧게 잘린 구간보다 문맥이 길어 정확도가 올라간다.
// 구간 번호는 저장된 줄에도 남으니, 다시 켜도 겹치지 않게 시각으로 시작한다
let worker, ready = false, nextId = Date.now(), pendingCount = 0;
let pworker = null, pready = false, pModel = null;
let liveDevice = null; // 'webgpu' | 'wasm'
let gpuFallback = false; // GPU가 느려서 CPU로 바꿨는지
let pDevice = null;
// 'GPU'를 골랐어도, 이 기기에서 GPU가 느렸던 적이 있으면 CPU로 시작한다.
// (처리 방식을 다시 고르면 그 기억을 지우고 GPU를 다시 시도한다)
function engineDevice() {
  const v = $('#device').value;
  if (v === 'auto' && (gpuFallback || store.get('gpuSlow', '') === '1')) return 'wasm';
  return v;
}
const segEls = new Map();      // 실시간 전사 대기 중인 구간: id → {el, t}
const groupEls = new Map();    // 정밀 전사 대기 중인 묶음: id → {el, t, segs}
const segWaiters = new Map();  // 실시간 결과를 기다리는 정밀 전사: 구간 id → resolve
const refiningSegs = new Set(); // 정밀 전사 중인 구간 id (해당 초안 줄을 점선으로 표시)
const refinedSegs = new Set();  // 이미 정밀 결과로 바뀐 구간 id (늦게 온 실시간 결과는 버림)
const lines = []; // {t, lang, text, seg?, fine?}
let preciseTotal = 0, preciseDone = 0;

// 모델 다운로드 진행률 표시 (워커마다 따로 셈)
function progressHandler(label) {
  const files = {};
  return (m) => {
    files[m.file] = m;
    let l = 0, t = 0;
    for (const f of Object.values(files)) { l += f.loaded; t += f.total; }
    barEl.style.display = 'block';
    barFill.style.width = (t ? (l / t) * 100 : 0) + '%';
    statusEl.textContent = `${label} 모델 불러오는 중… ${(l / 1e6).toFixed(0)} / ${(t / 1e6).toFixed(0)} MB (처음에만 내려받아요)`;
  };
}

function startWorker() {
  ready = false; recBtn.disabled = true; gpuFallback = false;
  worker?.terminate();
  worker = new Worker('worker.js', { type: 'module' });
  const onProgress = progressHandler('실시간');
  worker.onmessage = (e) => {
    const m = e.data;
    if (m.type === 'progress') {
      onProgress(m);
    } else if (m.type === 'status') {
      barEl.style.display = 'none';
      statusEl.textContent = m.text;
    } else if (m.type === 'ready') {
      ready = true; recBtn.disabled = false; barEl.style.display = 'none';
      liveDevice = m.device;
      statusEl.textContent = m.selftest?.ok
        ? `준비 완료 · ${m.device === 'webgpu' ? 'GPU 가속' : 'CPU'} 사용`
        : `준비됐지만 자체 점검 결과가 이상해요 (${m.device}): "${m.selftest?.text || ''}"`;
    } else if (m.type === 'device') {
      // GPU가 너무 느려서 엔진이 스스로 CPU로 바꿨다
      liveDevice = m.device;
      gpuFallback = true;
      store.set('gpuSlow', '1'); // 다음에 켤 때는 처음부터 CPU로
      updateQueue();
    } else if (m.type === 'result') {
      if (typeof m.id === 'string') onPartialResult(m); else onResult(m);
    } else if (m.type === 'error') {
      statusEl.textContent = '모델 로드 실패: ' + m.message;
    }
  };
  worker.postMessage({ type: 'load', model: $('#model').value, device: engineDevice() });
}

// 정밀 전사 워커는 처음 쓸 때 만든다 (small은 처음 한 번 수백 MB를 내려받는다)
// 자동: 실시간 엔진이 GPU를 쓰면 small, CPU면 base. small은 CPU에서 base보다 2.5배쯤 느려서
// 휴대폰 CPU로는 녹음 길이의 몇 배가 걸린다.
function preciseModel() {
  const v = $('#precise').value;
  if (v !== 'auto') return v;
  return liveDevice === 'webgpu' ? 'onnx-community/whisper-small' : 'onnx-community/whisper-base';
}
function ensurePreciseWorker() {
  const model = preciseModel();
  if (model === 'off') return null;
  if (pworker && pModel === model && pDevice === engineDevice()) return pworker;
  pworker?.terminate();
  pready = false; pModel = model;
  pworker = new Worker('worker.js', { type: 'module' });
  const onProgress = progressHandler('정밀 전사');
  pworker.onmessage = (e) => {
    const m = e.data;
    if (m.type === 'progress') onProgress(m);
    else if (m.type === 'status') { barEl.style.display = 'none'; statusEl.textContent = '정밀 전사: ' + m.text; }
    else if (m.type === 'ready') { pready = true; barEl.style.display = 'none'; updateQueue(); }
    else if (m.type === 'result') onPreciseResult(m);
    else if (m.type === 'error') {
      barEl.style.display = 'none';
      statusEl.textContent = '정밀 전사 모델 로드 실패: ' + m.message + ' (실시간 결과는 그대로 둬요)';
      failPrecise();
    }
  };
  pDevice = engineDevice();
  pworker.postMessage({ type: 'load', model, device: pDevice });
  return pworker;
}

function stopPreciseWorker() {
  pworker?.terminate(); pworker = null; pready = false; pModel = null;
  failPrecise();
}

// 정밀 전사를 못 하게 되면 대기 중인 묶음을 풀고 초안을 그대로 둔다
function failPrecise() {
  for (const g of groupEls.values()) for (const s of g.segs) refiningSegs.delete(s.id);
  groupEls.clear();
  preciseTotal = preciseDone = 0;
  render(); updateQueue();
}

const fmt = (s) => {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
};

// 정밀 전사에 다시 쓰려고 구간 소리를 16비트로 보관한다 (Float32의 절반 크기, 1시간 ≈ 115MB)
const toInt16 = (f) => { const o = new Int16Array(f.length); for (let i = 0; i < f.length; i++) o[i] = Math.max(-1, Math.min(1, f[i])) * 32767; return o; };

// ---------- 말하는 중 미리보기 ----------
// 구간이 끝나기 전에도 지금까지의 소리를 전사해 회색 글씨로 보여 준다.
// 엔진이 다른 일을 하고 있으면 건너뛰어서, 미리보기 때문에 확정 전사가 밀리지 않게 한다.
let interim = null; // {t, el, id}
let partialInFlight = false, partialSeq = 0;
function pendingEl(t, text) {
  const el = document.createElement('div');
  el.className = 'line pending';
  el.innerHTML = `<div class="meta">${fmt(t)}</div><div class="text"></div>`;
  el.querySelector('.text').textContent = text;
  return el;
}
function sendPartial(samples, t) {
  if (!ready || partialInFlight || pendingCount > 0) return;
  partialInFlight = true;
  if (!interim || interim.t !== t) { interim = { t, el: pendingEl(t, '듣는 중…'), sid: cur.id }; render(); }
  interim.id = 'p' + ++partialSeq;
  worker.postMessage({ type: 'transcribe', id: interim.id, audio: samples, lang: $('#lang').value, prompt: hintText(60, false) }, [samples.buffer]);
}
function onPartialResult(m) {
  partialInFlight = false;
  if (!interim || interim.id !== m.id || !m.text || isJunk(m.text)) return;
  interim.text = applyLearned(cleanRepeats(m.text));
  interim.el.querySelector('.text').textContent = interim.text + ' …';
}

// session: 녹음 한 번(또는 파일 하나)의 구간 목록. 정밀 전사가 끝나면 버린다.
function sendSegment(samples, t, session) {
  const id = nextId++;
  // 미리보기가 있던 구간이면 확정될 때까지 그 글씨를 그대로 보여 준다
  const preview = interim && interim.t === t && interim.text;
  interim = null;
  const el = pendingEl(t, preview ? preview + ' …' : '전사 중…');
  segEls.set(id, { el, t, sid: cur.id });
  if (session) {
    session.push({ id, t, pcm: toInt16(samples), live: new Promise((res) => segWaiters.set(id, res)) });
  }
  pendingCount++;
  render();
  updateQueue();
  worker.postMessage({ type: 'transcribe', id, audio: samples, lang: $('#lang').value, prompt: hintText(60, false) }, [samples.buffer]);
}

function onResult(m) {
  const seg = segEls.get(m.id);
  segEls.delete(m.id);
  pendingCount--;
  const junk = !m.text || isJunk(m.text);
  // 걸러낸 문구("Thank you." 등)도 실제 말일 수 있어서, 감지된 언어는 묶음 나누기에 그대로 쓴다
  segWaiters.get(m.id)?.({ lang: m.lang, junk });
  segWaiters.delete(m.id);
  if (seg && !junk && !refinedSegs.has(m.id)) {
    const line = { t: seg.t, lang: m.lang, text: applyLearned(cleanRepeats(m.text)), seg: m.id };
    withLines(seg.sid, (ls) => ls.push(line));
  }
  render();
  updateQueue();
}

// ---------- 고치기와 고친 말 기억 ----------
// 전사된 줄을 눌러 고치면 고치기 전/후를 비교해 바뀐 조각(잘못 들린 말 → 고친 말)을 기록한다.
// Whisper는 같은 소리를 들으면 같은 식으로 잘못 적는 경향이 있어서, 잘못 적힌 글자가 곧 그 소리의 흔적이다.
// 기록은 두 가지로 쓴다.
//  1) 힌트: 고친 말을 전사 엔진의 '앞 문맥'으로 넣어, 비슷한 소리를 들으면 그 표기를 고르게 한다.
//  2) 자동 바꾸기: 그래도 같은 글자로 잘못 적히면 결과에서 고친 말로 바꾼다 (띄어쓰기는 무시하고 비교).
let editing = null, renderQueued = false;
const editedSegs = new Set(); // 사용자가 고친 실시간 구간 (정밀 전사가 덮어쓰지 않게)
let learned = [];
try { learned = JSON.parse(store.get('learned', '[]')).filter((r) => r.kind); } catch {}
const saveLearned = () => { store.set('learned', JSON.stringify(learned)); updateLearnBtn(); };

const PUNCT_CH = /[.,!?。、·"'“”‘’()\[\]…:;~\-]/;
const PUNCT = new RegExp(PUNCT_CH.source, 'g');
const bare = (w) => w.toLowerCase().replace(PUNCT, '');
const words = (s) => s.split(/\s+/).filter(Boolean);
const EDGE_PUNCT = /^[.,!?·"'“”‘’()\[\]…:;~\-]+|[.,!?·"'“”‘’()\[\]…:;~\-]+$/g;
const clean = (s) => s.replace(EDGE_PUNCT, '').trim();

// 띄어쓰기·문장부호를 뺀 글자열과, 각 글자가 원문 어디에 있었는지
function squash(s) {
  let n = '';
  const pos = [];
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (/\s/.test(c) || PUNCT_CH.test(c)) continue;
    n += c.toLowerCase();
    pos.push(i);
  }
  return { n, pos };
}

// 낱말 끝의 조사를 떼어 힌트 낱말로 쓴다 ("이미지슬림을" → "이미지슬림")
const JOSA = ['에서', '에게', '한테', '으로', '까지', '부터', '처럼', '보다', '로', '을', '를', '이', '가', '은', '는', '의', '에', '와', '과', '도', '만'];
function stripJosa(w) {
  for (const j of JOSA) if (w.endsWith(j) && w.length - j.length >= 2) return w.slice(0, -j.length);
  return w;
}

// LCS로 차이를 찾는다. unit: 'word'면 낱말 배열, 'char'면 글자열
function lcsOps(a, b) {
  const L = Array.from({ length: a.length + 1 }, () => new Int32Array(b.length + 1));
  for (let i = a.length - 1; i >= 0; i--)
    for (let j = b.length - 1; j >= 0; j--)
      L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = [];
  let i = 0, j = 0;
  while (i < a.length || j < b.length) {
    if (i < a.length && j < b.length && a[i] === b[j]) { ops.push(['=', i++, j++]); }
    else if (j < b.length && (i === a.length || L[i][j + 1] >= L[i + 1][j])) ops.push(['+', i, j++]);
    else ops.push(['-', i++, j]);
  }
  return ops;
}

// 낱말 단위로 바뀐 덩어리
function wordBlocks(oldText, newText) {
  const a = words(oldText), b = words(newText);
  const blocks = [];
  let fa = [], fb = [];
  const flush = () => { if (fa.length || fb.length) blocks.push({ from: fa, to: fb }); fa = []; fb = []; };
  for (const [op, i, j] of lcsOps(a.map(bare), b.map(bare))) {
    if (op === '=') flush();
    else if (op === '+') fb.push(b[j]);
    else fa.push(a[i]);
  }
  flush();
  return blocks;
}

// 바뀐 곳을 낱말 단위로 찾는다. 글자 단위로 비교해 바뀐 글자가 들어 있는 낱말을 표시하고,
// 표시된 낱말이 이어지는 구간을 하나로 묶는다. (글자 단위로만 자르면 "여기 → 요기이", "트 → 즈"처럼
// 낱말 조각이 기록돼서 쓸모가 없었다)
function wordRegions(fromWords, toWords) {
  const A = fromWords.map((w) => squash(w).n), B = toWords.map((w) => squash(w).n);
  const wa = [], wb = [];
  A.forEach((w, k) => { for (const _ of w) wa.push(k); });
  B.forEach((w, k) => { for (const _ of w) wb.push(k); });
  const a = A.join(''), b = B.join('');
  const ops = lcsOps(a, b);
  const near = (arr, i) => arr[Math.min(Math.max(i, 0), arr.length - 1)];
  const wordsOf = ([op, i, j]) => [op === '+' ? near(wa, i - 1) : wa[i], op === '-' ? near(wb, j - 1) : wb[j]];
  const Mo = new Set(), Mn = new Set();
  for (const op of ops) {
    if (op[0] === '=') continue;
    const [wo, wn] = wordsOf(op);
    if (wo != null) Mo.add(wo);
    if (wn != null) Mn.add(wn);
  }
  const regions = [];
  let rg = null;
  for (const op of ops) {
    const [wo, wn] = wordsOf(op);
    if (Mo.has(wo) || Mn.has(wn) || op[0] !== '=') {
      rg ??= { fo: wo ?? 0, fe: wo ?? 0, to: wn ?? 0, te: wn ?? 0 };
      if (wo != null) { rg.fo = Math.min(rg.fo, wo); rg.fe = Math.max(rg.fe, wo); }
      if (wn != null) { rg.to = Math.min(rg.to, wn); rg.te = Math.max(rg.te, wn); }
    } else if (rg) { regions.push(rg); rg = null; }
  }
  if (rg) regions.push(rg);
  return regions;
}

function addRule(rule) {
  const { from, to } = rule;
  if (!to) return false;
  // 같은 잘못 들린 말에 대한 예전 규칙과, 방금 것을 되돌리는 규칙은 지운다
  learned = learned.filter((r) =>
    !(from && r.from === from && r.to !== to) && !(r.from && r.from === squash(to).n && squash(r.to).n === from));
  const hit = learned.find((r) => r.from === from && r.to === to);
  if (hit) { hit.n++; hit.at = Date.now(); hit.cat = rule.cat; }
  else learned.push({ ...rule, n: 1, at: Date.now() });
  return true;
}

function learnFrom(oldText, newText, lang) {
  let changed = false;
  const cat = currentCategory();
  for (const blk of wordBlocks(oldText, newText)) {
    if (!blk.to.length || blk.from.length > 10 || blk.to.length > 10) continue; // 지운 말, 통째로 다시 쓴 문장은 건너뜀
    const oldStr = blk.from.join(' '), newStr = clean(blk.to.join(' '));
    if (!blk.from.length) { changed = addRule({ kind: 'hint', from: '', show: '', to: newStr, lang, cat }) || changed; continue; }
    const A = squash(oldStr), B = squash(newStr);
    // 1) 글자가 바뀐 낱말들: "여기 ISO 둘째" → "요기이소 툴즈"
    for (const rg of wordRegions(blk.from, blk.to)) {
      const fw = blk.from.slice(rg.fo, rg.fe + 1), tw = blk.to.slice(rg.to, rg.te + 1);
      // 끝 낱말에 같은 조사가 붙어 있으면 떼어서, 다른 조사가 붙어도 맞게 한다 ("상도님들을" → "상도님들")
      const lf = clean(fw.at(-1)), lt = clean(tw.at(-1));
      const j = JOSA.find((x) => lf.endsWith(x) && lt.endsWith(x) && lf.length > x.length && lt.length > x.length);
      if (j) { fw[fw.length - 1] = lf.slice(0, -j.length); tw[tw.length - 1] = lt.slice(0, -j.length); }
      const from = squash(fw.join(' ')).n, to = clean(tw.join(' '));
      if (!to || from === squash(to).n || from.length > 24) continue;
      changed = addRule({ kind: from.length >= 2 ? 'char' : 'hint', from: from.length >= 2 ? from : '', show: clean(fw.join(' ')), to, lang, cat }) || changed;
    }
    // 2) 띄어쓰기만 바뀐 낱말: "이미지 슬림" → "이미지슬림"
    const oldBare = new Set(blk.from.map((w) => stripJosa(bare(w))));
    for (const w of blk.to) {
      const t = stripJosa(clean(w)), tb = squash(t).n;
      const at = A.n.indexOf(tb);
      if (tb.length >= 3 && !oldBare.has(tb) && at >= 0) {
        const show = oldStr.slice(A.pos[at], A.pos[at + tb.length - 1] + 1);
        changed = addRule({ kind: 'char', from: tb, show, to: t, lang, cat }) || changed;
      }
    }
  }
  if (changed) saveLearned();
}

// 결과에 잘못 들린 글자가 그대로 나오면 고친 말로 바꾼다. 띄어쓰기·문장부호는 무시하고 찾는다.
// 2글자짜리는 다른 낱말 속에서 잘못 바뀔 수 있어서 3글자 이상만 바꾼다 (2글자는 힌트로만 쓴다).
function applyLearned(text) {
  const rules = learned.filter((r) => r.kind === 'char' && r.from.length >= 3).sort((x, y) => y.from.length - x.from.length);
  for (const r of rules) {
    const { n, pos } = squash(text);
    const hits = [];
    for (let i = n.indexOf(r.from); i >= 0; i = n.indexOf(r.from, i + r.from.length)) hits.push(i);
    for (const i of hits.reverse()) {
      const s = pos[i], e = pos[i + r.from.length - 1] + 1;
      if (text.slice(s, e) !== r.to) text = text.slice(0, s) + r.to + text.slice(e);
    }
  }
  return text;
}

// ---------- 상황(카테고리)별 어휘 ----------
// 같은 소리도 상황에 따라 다른 말이다 (교회의 "은혜" / 병원의 "은혜"는 드물다).
// 상황을 고르거나 지금까지 전사된 내용으로 자동으로 알아내서, 그 상황의 어휘를 힌트에 넣는다.
const CATEGORIES = {
  church: { label: '교회 · 예배', words: ['하나님', '예수님', '예수 그리스도', '성령', '주님', '아멘', '할렐루야', '은혜', '말씀', '성경', '찬양', '찬송가', '예배', '기도', '설교', '목사님', '전도사님', '장로님', '권사님', '집사님', '성도', '구원', '복음', '십자가', '부활', '축복', '회개', '믿음', '소망', '선교', '헌금', '주일', '중보 기도', '구역 예배', '큐티', '창세기', '요한복음', '시편', '로마서', '마태복음', '사도행전'] },
  hospital: { label: '병원 · 진료', words: ['환자', '의사', '간호사', '진료', '진단', '처방', '처방전', '증상', '통증', '혈압', '혈당', '당뇨', '고혈압', '검사', '피검사', '엑스레이', 'CT', 'MRI', '초음파', '내시경', '수술', '입원', '퇴원', '외래', '응급실', '복용', '부작용', '알레르기', '주사', '수액', '염증', '항생제', '진통제', '소화제', '처치', '실비 보험', '재진', '수납'] },
  meeting: { label: '회의 · 업무', words: ['회의', '안건', '일정', '예산', '분기', '매출', '실적', '보고서', '프로젝트', '마감', '담당자', '팀장님', '부장님', '대표님', '결재', '검토', '계약', '고객', '제안서', '기획', '마케팅', '개발', '출시', '피드백', 'KPI', '미팅', '이메일', '엑셀', '일정 조율', '거래처', '견적서'] },
  class: { label: '수업 · 강의', words: ['수업', '강의', '교수님', '선생님', '학생', '과제', '숙제', '시험', '중간고사', '기말고사', '발표', '출석', '학점', '교재', '페이지', '챕터', '문제', '정답', '개념', '정의', '예제', '공식', '질문', '토론', '레포트', '제출'] },
};

// 지금까지 전사된 최근 내용에서 상황 낱말이 몇 번 나왔는지로 상황을 정한다
let detectedCat = null;
function detectCategory() {
  const recent = lines.slice(-40).map((l) => l.text).join(' ');
  const score = {};
  for (const [k, c] of Object.entries(CATEGORIES)) {
    score[k] = c.words.reduce((n, w) => n + (recent.split(w).length - 1), 0);
  }
  const [best, second] = Object.entries(score).sort((x, y) => y[1] - x[1]);
  // 3번 이상 나오고 2위보다 확실히 많을 때만 정한다. 아니면 직전 판단을 유지한다
  if (best[1] >= 3 && best[1] >= second[1] * 1.5) detectedCat = best[0];
  return detectedCat;
}
function currentCategory() {
  const v = $('#category').value;
  if (v === 'auto') return detectCategory();
  return v === 'none' ? null : v;
}

// 전사 엔진에 줄 힌트: "상황: 고친 말, 상황 어휘…" (최근에 고친 말이 먼저)
// 힌트가 길수록 구간마다 읽을 것이 늘어 느려진다. 실시간은 고친 말만 짧게(60자),
// 녹음 후 정밀 전사는 상황 어휘까지 넣는다(160자).
function hintText(maxLen = 160, withCategory = true) {
  const cat = currentCategory();
  const out = [], seen = new Set();
  const add = (w) => { w = w.trim(); if (!w || seen.has(w)) return true; seen.add(w); out.push(w); if (out.join(', ').length > maxLen) { out.pop(); return false; } return true; };
  const mine = [...learned].sort((x, y) => (y.cat === cat) - (x.cat === cat) || y.at - x.at);
  for (const r of mine) if (!add(r.to)) break;
  if (cat && withCategory) for (const w of CATEGORIES[cat].words) if (!add(w)) break;
  if (!out.length) return '';
  // 쉼표로 늘어놓은 목록을 주면 결과에도 쉼표를 마구 찍어서(base에서 확인), 짧은 문장처럼 준다
  const head = cat && withCategory ? CATEGORIES[cat].label.replace(' · ', ' ') + ' 이야기입니다. ' : '';
  return head + out.join(' ') + '.';
}

function startEdit(el, l) {
  if (editing || !el.isConnected) return;
  // 재생 중에 고치려고 누르면 그 자리에서 멈춘다 (▶ 버튼을 누르면 멈춘 곳부터 이어서 듣는다)
  if (!audioEl.paused) { stopAt = null; audioEl.pause(); }
  editing = l;
  if (l.seg != null) editedSegs.add(l.seg);
  const textEl = el.querySelector('.text');
  const wrap = document.createElement('div');
  wrap.style.flex = '1';
  const ta = document.createElement('textarea');
  ta.value = l.text;
  ta.rows = Math.min(8, Math.max(2, Math.ceil(l.text.length / 28)));
  ta.style.width = '100%';
  const hint = document.createElement('div');
  hint.className = 'edit-hint';
  if (!playerEl.hidden) {
    // 고치면서 그 부분 소리를 들어 본다. 누를 때 입력창이 닫히지 않게 포커스를 뺏지 않는다
    const listen = document.createElement('button');
    listen.type = 'button';
    listen.textContent = '▶ 이 부분 듣기';
    listen.addEventListener('pointerdown', (e) => e.preventDefault());
    listen.addEventListener('click', () => playFrom(l, true));
    hint.append(listen);
  }
  hint.append('Enter 저장 · Esc 취소 · 모두 지우고 저장하면 줄 삭제');
  wrap.append(ta, hint);
  textEl.replaceWith(wrap);
  ta.focus();
  let done = false;
  const finish = (save) => {
    if (done) return;
    done = true;
    editing = null;
    if (save) {
      const nt = ta.value.replace(/\s+/g, ' ').trim();
      if (!nt) {
        const i = lines.indexOf(l);
        if (i >= 0) lines.splice(i, 1);
      } else if (nt !== l.text) {
        learnFrom(l.text, nt, l.lang);
        l.text = nt; l.edited = true;
      }
      persist();
    }
    renderQueued = false;
    render();
    updateQueue();
  };
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); finish(true); }

  });
  ta.addEventListener('blur', () => finish(true));
}

// ---------- 녹음 후 정밀 전사 ----------
const GROUP_MAX = 28;  // 초. Whisper는 30초 단위로 보므로 그 안에서 묶는다
const GROUP_GAP = 6;   // 초. 이보다 오래 말이 없었으면 새 묶음 (시각 표시가 너무 어긋나지 않게)

async function runPrecise(session) {
  if (!session.length || preciseModel() === 'off') return;
  // 실시간 결과의 언어로 묶음을 나눈다. 한 묶음 안에 한국어와 영어가 섞이면
  // 하나의 언어로 강제돼 다른 언어 문장이 번역되거나 깨질 수 있기 때문이다.
  const live = await Promise.all(session.map((s) => s.live));
  // 실시간 전사가 다 끝난 뒤에 정밀 모델을 준비한다 (같이 돌면 CPU를 나눠 써서 둘 다 느려진다)
  if (!ensurePreciseWorker()) return; // 기다리는 동안 정밀 전사를 껐으면 중단
  const groups = [];
  let cur = null;
  session.forEach((s, i) => {
    const r = live[i];
    const dur = s.pcm.length / SR;
    const lastEnd = cur ? cur.segs.at(-1).t + cur.segs.at(-1).pcm.length / SR : 0;
    const fits = cur && s.t + dur - cur.t <= GROUP_MAX && s.t - lastEnd <= GROUP_GAP;
    const sameLang = !r.lang || !cur?.lang || r.lang === cur.lang;
    if (!fits || !sameLang) { cur = { t: s.t, lang: null, segs: [], speech: false }; groups.push(cur); }
    cur.segs.push(s);
    if (r.lang) cur.lang = cur.lang || r.lang;
    if (!r.junk) cur.speech = true;
  });

  for (const g of groups) {
    if (!g.speech) continue; // 실시간에서 말이 하나도 안 나온 묶음은 건너뜀
    // 구간 사이에 0.3초 무음을 넣어 이어 붙인다
    const gap = Math.round(SR * 0.3);
    const total = g.segs.reduce((n, s) => n + s.pcm.length, 0) + gap * (g.segs.length - 1);
    const audio = new Float32Array(total);
    let p = 0;
    for (const s of g.segs) {
      for (let i = 0; i < s.pcm.length; i++) audio[p + i] = s.pcm[i] / 32767;
      p += s.pcm.length + gap;
      s.pcm = null;
      refiningSegs.add(s.id);
    }
    const id = nextId++;
    const el = document.createElement('div');
    el.className = 'line pending';
    el.innerHTML = `<div class="meta">${fmt(g.t)}</div><div class="text">정밀 전사 대기…</div>`;
    groupEls.set(id, { el, t: g.t, segs: g.segs, sid: session.sid });
    preciseTotal++;
    pworker.postMessage({ type: 'transcribe', id, audio, lang: $('#lang').value, maxTokens: 440, prompt: hintText() }, [audio.buffer]);
  }
  render();
  updateQueue();
}

function onPreciseResult(m) {
  const g = groupEls.get(m.id);
  groupEls.delete(m.id);
  if (!g) return;
  preciseDone++;
  const ids = new Set(g.segs.map((s) => s.id));
  for (const id of ids) refiningSegs.delete(id);
  const text = m.text ? applyLearned(cleanRepeats(m.text)) : '';
  // 사용자가 그 사이에 고친 줄이 있으면 고친 내용을 지키려고 초안을 그대로 둔다
  const userEdited = [...ids].some((id) => editedSegs.has(id));
  // 정밀 결과가 비었거나 이상하면 초안을 그대로 둔다
  if (!m.error && text && !isJunk(text) && !userEdited) {
    for (const id of ids) {
      refinedSegs.add(id);
      const pending = segEls.get(id);
      if (pending) { segEls.delete(id); }
    }
    withLines(g.sid, (ls) => {
      // 정밀 결과를 실시간 구간(말이 쉬는 곳에서 잘린 정확한 시각)에 나눠 붙인다.
      // 한 묶음(최대 28초)을 한 줄로 두면 노래방식 재생에서 따라가기 어렵기 때문이다.
      const liveText = g.segs.map((sg) => ls.find((l) => l.seg === sg.id)?.text || '');
      for (let i = ls.length - 1; i >= 0; i--) if (ids.has(ls[i].seg)) ls.splice(i, 1);
      for (const piece of splitBySegments(text, g.segs, liveText)) ls.push({ t: piece.t, lang: m.lang, text: piece.text, fine: true });
    });
  }
  if (!groupEls.size) preciseTotal = preciseDone = 0;
  render();
  updateQueue();
}

// 정밀 결과 글을 구간마다 나눈다: 각 구간의 실시간 글자 수 비율로 자를 곳을 정하고,
// 가까운 낱말 경계(근처에 문장 끝이 있으면 그곳)에서 자른다.
function splitBySegments(text, segs, liveText) {
  const w = liveText.map((x) => x.replace(/\s/g, '').length);
  const total = w.reduce((a, b) => a + b, 0);
  if (segs.length < 2 || !total) return [{ t: segs[0].t, text }];
  const words = text.split(/\s+/).filter(Boolean);
  const ends = []; // 낱말 k 뒤의 누적 글자 수 (띄어쓰기 제외)
  let c = 0; for (const x of words) { c += x.length; ends.push(c); }
  const chars = c;
  const cuts = [0];
  let acc = 0;
  for (let k = 0; k < segs.length - 1; k++) {
    acc += w[k];
    const target = (acc / total) * chars;
    let best = cuts.at(-1), bestScore = Infinity;
    for (let b = cuts.at(-1); b <= words.length; b++) {
      const pos = b === 0 ? 0 : ends[b - 1];
      const sentence = b > 0 && /[.?!。]$/.test(words[b - 1]);
      const score = Math.abs(pos - target) - (sentence ? 6 : 0);
      if (score < bestScore) { bestScore = score; best = b; }
    }
    cuts.push(best);
  }
  cuts.push(words.length);
  const out = [];
  for (let k = 0; k < segs.length; k++) {
    const piece = words.slice(cuts[k], cuts[k + 1]).join(' ');
    if (piece) out.push({ t: segs[k].t, text: piece });
  }
  return out.length ? out : [{ t: segs[0].t, text }];
}

// Whisper가 무음에서 흔히 만들어내는 문구 걸러내기
const JUNK = [/^\(.*\)$/, /^\[.*\]$/, /^♪+$/, /시청해\s*주셔서\s*감사합니다/, /구독과\s*좋아요/, /^thank you\.?$/i, /^thanks for watching/i, /^you$/i, /^\.+$/];
const isJunk = (t) => JUNK.some((r) => r.test(t.trim()));
// 긴 구간에서 Whisper가 같은 말을 계속 되풀이하는 경우가 있어, 3번 이상 연속 반복은 한 번으로 줄인다
const cleanRepeats = (t) => t.replace(/(.{4,40}?)(?:[\s,.]*\1){2,}/g, '$1').trim();

function updateQueue() {
  if (!ready) return;
  const parts = [];
  if (pendingCount > 0) parts.push(`전사 대기 ${pendingCount}개`);
  if (groupEls.size) parts.push(pready ? `정밀 전사 ${preciseDone + 1}/${preciseTotal} (${(pModel || '').split('-').pop()})` : '정밀 전사 모델 준비 중');
  const cat = currentCategory();
  const catText = cat ? ` · 상황: ${CATEGORIES[cat].label}${$('#category').value === 'auto' ? ' (자동)' : ''}` : '';
  const dev = liveDevice ? ` · ${liveDevice === 'webgpu' ? 'GPU' : 'CPU'}${liveDevice === 'wasm' && window.crossOriginIsolated ? ' 여러 스레드' : ''}${liveDevice === 'wasm' && $('#device').value === 'auto' ? ' (이 기기는 GPU가 느려서 CPU 사용)' : ''}` : '';
  statusEl.textContent = (parts.length ? parts.join(' · ') : (recording ? '녹음 중 · 말하면 바로 전사돼요' : '준비 완료')) + dev + catText;
  const has = lines.length > 0;
  $('#copy').disabled = $('#saveTxt').disabled = !has;
}

// 전사 줄과 대기 중인 줄을 시각 순서대로 다시 그린다
function lineEl(l) {

}
function render() {
  // 고치는 중에는 다시 그리지 않는다 (입력 중인 내용이 사라지지 않게). 다 고치면 그린다
  if (editing) { renderQueued = true; return; }
  lineEls.clear();
  const mine = (x) => x.sid === cur.id;
  const items = [
    ...lines.map((l) => { const el = lineEl(l); lineEls.set(l, el); return { t: l.t, el }; }),
    ...[...segEls.values()].filter(mine),
    ...[...groupEls.values()].filter(mine),
    ...(interim && mine(interim) ? [interim] : []),
  ];

  transcriptEl.replaceChildren(...items.map((i) => i.el));
  // 재생 중이던 줄 강조를 새 요소에 다시 입힌다
  if (nowLine) { const l = nowLine; nowLine = null; if (lines.includes(l)) setNowLine(l, audioEl.currentTime); }
  if (audioEl.paused) scrollDown();
}

let stick = true;
transcriptEl.addEventListener('scroll', () => {
  stick = transcriptEl.scrollHeight - transcriptEl.scrollTop - transcriptEl.clientHeight < 40;
});
const scrollDown = () => { if (stick) transcriptEl.scrollTop = transcriptEl.scrollHeight; };

const asText = () => lines.map((l) => `[${fmt(l.t)}] ${l.text}`).join('\n');
// ---------- 문장 단위로 자르기 (무음 기준) ----------
// 100ms 프레임 단위로 소리 크기를 보고, 말이 끝난 뒤 잠깐 조용해지면 잘라서 전사로 보낸다.
// 쉬지 않고 계속 말하면 MAX_SEG초에서 자르는데, 낱말 중간이 잘리지 않게 마지막 2초 중 가장 조용한 곳에서 자른다.
// (예전엔 25초까지 기다려서, 이어서 말하면 첫 글자가 30초 가까이 늦게 나왔다)
// onPartial: 말하는 중에 지금까지의 소리를 미리보기로 전사하라고 PARTIAL_EVERY초마다 알린다.
const MAX_SEG = 10, PARTIAL_EVERY = 2.5;
class Segmenter {
  constructor(onSegment, onPartial) {
    this.onSegment = onSegment;
    this.onPartial = onPartial;
    this.frame = SR / 10;
    this.buf = new Float32Array(0);
    this.chunks = []; this.len = 0; // chunks: {d: 소리, rms, speech}
    this.offset = 0;        // 현재 구간 시작 시각(초)
    this.silentFrames = 0; this.speechFrames = 0;
    this.noise = 0.002;
    this.lastPartial = 0;
  }
  push(samples) {
    const b = new Float32Array(this.buf.length + samples.length);
    b.set(this.buf); b.set(samples, this.buf.length);
    let i = 0;
    for (; i + this.frame <= b.length; i += this.frame) this.addFrame(b.subarray(i, i + this.frame));
    this.buf = b.slice(i);
  }
  addFrame(f) {
    let s = 0; for (let i = 0; i < f.length; i++) s += f[i] * f[i];
    const rms = Math.sqrt(s / f.length);
    const speech = rms > Math.max(0.004, this.noise * 2.5);
    if (!speech) this.noise = this.noise * 0.95 + rms * 0.05;
    this.level?.(rms);

    this.chunks.push({ d: f.slice(), rms, speech }); this.len += f.length;
    if (speech) { this.speechFrames++; this.silentFrames = 0; } else this.silentFrames++;

    const dur = this.len / SR;
    // 말 없이 조용한 구간이 길어지면 앞부분을 버리고 시작점을 당긴다
    if (this.speechFrames === 0 && this.chunks.length > 5) {
      const drop = this.chunks.shift(); this.len -= drop.d.length; this.offset += drop.d.length / SR;
      return;
    }
    if (this.speechFrames >= 3 && this.silentFrames >= 7 && dur >= 1.5) { this.cut(this.chunks.length); return; }
    if (dur >= MAX_SEG) {
      // 마지막 2초(20프레임) 중 가장 조용한 프레임 뒤에서 자르고, 나머지는 다음 구간으로 넘긴다
      let q = this.chunks.length - 1;
      for (let k = Math.max(1, this.chunks.length - 20); k < this.chunks.length; k++) if (this.chunks[k].rms < this.chunks[q].rms) q = k;
      this.cut(q + 1);
      return;
    }
    // 말하는 중이면 미리보기 전사를 요청한다
    if (this.onPartial && this.speechFrames >= 3 && dur - this.lastPartial >= PARTIAL_EVERY) {
      this.lastPartial = dur;
      this.onPartial(this.joined(this.chunks.length), this.offset);
    }
  }
  joined(n) {
    let size = 0; for (let k = 0; k < n; k++) size += this.chunks[k].d.length;
    const out = new Float32Array(size);
    let p = 0; for (let k = 0; k < n; k++) { out.set(this.chunks[k].d, p); p += this.chunks[k].d.length; }
    return out;
  }
  // 앞의 n프레임을 한 구간으로 보내고, 뒤는 남긴다
  cut(n) {
    if (this.len === 0 || n <= 0) return;
    const out = this.joined(n);
    const start = this.offset;
    const hadSpeech = this.chunks.slice(0, n).filter((c) => c.speech).length >= 3;
    this.chunks = this.chunks.slice(n);
    this.len -= out.length;
    this.offset += out.length / SR;
    this.speechFrames = this.chunks.filter((c) => c.speech).length;
    this.silentFrames = 0;
    for (let k = this.chunks.length - 1; k >= 0 && !this.chunks[k].speech; k--) this.silentFrames++;
    this.lastPartial = 0;
    if (hadSpeech) this.onSegment(out, start);
  }
  flush() {
    if (this.buf.length) {
      this.chunks.push({ d: this.buf, rms: 0, speech: false }); this.len += this.buf.length; this.buf = new Float32Array(0);
    }
    this.cut(this.chunks.length);
  }
}

// ---------- 녹음 보관 (세션) ----------
// 녹음 한 번(또는 전사한 파일 하나)이 세션 하나다. 소리와 전사 줄을 함께 브라우저 저장소(IndexedDB)에 둔다.
// 소리는 전사 엔진이 듣는 16kHz 소리를 그대로 16비트로 보관한다 (1시간 ≈ 115MB).
// 브라우저 녹음기(webm)는 재생 위치를 옮기기 어렵고 전사 시각과 조금씩 어긋나서,
// 전사와 똑같은 소리를 저장해야 줄과 소리가 정확히 맞는다.
let cur = { id: 0, created: 0, kind: 'empty', name: '', duration: 0 };
let dbp = null;
function db() {
  dbp ??= new Promise((res, rej) => {
    const r = indexedDB.open('transcriber', 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore('sessions', { keyPath: 'id' });
      r.result.createObjectStore('audio', { keyPath: ['sid', 'idx'] });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(storeName, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(storeName, mode);
    const out = fn(t.objectStore(storeName));
    t.oncomplete = () => res(out?.result ?? out);
    t.onerror = () => rej(t.error);
  });
}
const getSession = (id) => tx('sessions', 'readonly', (s) => s.get(id));
const allSessions = () => tx('sessions', 'readonly', (s) => s.getAll());
const putSession = (v) => tx('sessions', 'readwrite', (s) => s.put(v));
const audioRange = (sid) => IDBKeyRange.bound([sid, 0], [sid, Infinity]);
async function deleteSession(id) {
  await tx('sessions', 'readwrite', (s) => s.delete(id));
  await tx('audio', 'readwrite', (s) => s.delete(audioRange(id)));
}

// 지금 보고 있는 세션 저장 (자주 불려서 0.4초 모아서 한 번에)
let saveTimer = null;
function persist() {
  if (!cur.id) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    putSession({ ...cur, lines: lines.map(({ t, lang, text, fine, edited, seg }) => ({ t, lang, text, fine, edited, seg })) }).catch(() => {});
  }, 400);
  store.set('currentSession', String(cur.id));
}

// 다른 세션(지난 녹음)의 줄을 바꿔야 할 때: 보고 있는 세션이면 화면에서, 아니면 저장된 것을 고친다
async function withLines(sid, fn) {
  if (sid === cur.id) { fn(lines); lines.sort((a, b) => a.t - b.t); persist(); render(); return; }
  const s = await getSession(sid).catch(() => null);
  if (!s) return;
  fn(s.lines);
  s.lines.sort((a, b) => a.t - b.t);
  await putSession(s).catch(() => {});
}

function newSession(kind, name = '') {
  const id = Date.now();
  cur = { id, created: id, kind, name, duration: 0 };
  lines.length = 0;
  editedSegs.clear();
  stopPlayback();
  render();
  persist();
  return id;
}

async function openSession(id) {
  const s = await getSession(id);
  if (!s) return;
  const { lines: ls, ...meta } = s;
  cur = meta;
  lines.length = 0;
  for (const l of ls || []) lines.push(l);
  store.set('currentSession', String(id));
  stopPlayback();
  render();
  updateQueue();
  await loadPlayer();
}

// 녹음하면서 소리를 5초씩 모아 저장한다 (앱이 갑자기 꺼져도 그때까지는 남는다)
let recPcm = [], recLen = 0, recIdx = 0, recTotal = 0;
function recordPcm(f) {
  const i16 = toInt16(f);
  recPcm.push(i16); recLen += i16.length; recTotal += i16.length;
  if (recLen >= SR * 5) flushPcm();
}
function flushPcm() {
  if (!recLen || !cur.id) return;
  const out = new Int16Array(recLen);
  let p = 0; for (const c of recPcm) { out.set(c, p); p += c.length; }
  recPcm = []; recLen = 0;
  const v = { sid: cur.id, idx: recIdx++, pcm: out.buffer };
  tx('audio', 'readwrite', (s) => s.put(v)).catch(() => {});
  cur.duration = recTotal / SR;
  persist();
}
function startAudioRecord() {
  recPcm = []; recLen = 0; recIdx = 0; recTotal = 0;
  // 저장 공간이 부족할 때 브라우저가 녹음을 지우지 않게 요청 (크롬은 보통 묻지 않고 정한다)
  navigator.storage?.persist?.().catch(() => {});
}

// 저장된 소리를 WAV로 묶는다
async function sessionWav(sid) {
  const chunks = await tx('audio', 'readonly', (s) => s.getAll(audioRange(sid)));
  const bytes = chunks.reduce((n, c) => n + c.pcm.byteLength, 0);
  if (!bytes) return null;
  const h = new DataView(new ArrayBuffer(44));
  const w = (o, s) => [...s].forEach((c, i) => h.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); h.setUint32(4, 36 + bytes, true); w(8, 'WAVE'); w(12, 'fmt ');
  h.setUint32(16, 16, true); h.setUint16(20, 1, true); h.setUint16(22, 1, true);
  h.setUint32(24, SR, true); h.setUint32(28, SR * 2, true); h.setUint16(32, 2, true); h.setUint16(34, 16, true);
  w(36, 'data'); h.setUint32(40, bytes, true);
  return new Blob([h.buffer, ...chunks.sort((a, b) => a.idx - b.idx).map((c) => c.pcm)], { type: 'audio/wav' });
}

// ---------- 노래방처럼 따라가며 듣기 ----------
// 재생 중인 위치의 줄을 강조하고, 그 줄 안에서는 지난 시간만큼 낱말을 차례로 칠한다.
// 줄마다 시작 시각만 알고 낱말별 시각은 몰라서, 줄 안의 낱말 위치는 글자 수 비율로 어림한다.
const audioEl = $('#audio'), playerEl = $('#player'), playBtn = $('#play'), seekEl = $('#pseek'), ptimeEl = $('#ptime');
let audioUrl = null, nowLine = null, stopAt = null, rafId = 0, userScrollAt = 0;
const lineEls = new Map(); // 줄 → 화면 요소 (render가 채운다)

async function loadPlayer() {
  stopPlayback();
  if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
  const blob = cur.id && cur.duration > 0 && !recording ? await sessionWav(cur.id).catch(() => null) : null;
  playerEl.hidden = !blob;
  $('#saveAudio').disabled = !blob;
  if (!blob) { audioEl.removeAttribute('src'); return; }
  audioUrl = URL.createObjectURL(blob);
  audioEl.src = audioUrl;
  seekEl.max = cur.duration;
  ptimeEl.textContent = `00:00 / ${fmt(cur.duration)}`;
}

function stopPlayback() {
  if (!audioEl.paused) audioEl.pause();
  stopAt = null;
  setNowLine(null);
}

function lineEnd(i) {
  return i + 1 < lines.length ? lines[i + 1].t : Math.max(lines[i].t + 1, cur.duration);
}

function setNowLine(l, t = 0) {
  if (nowLine !== l) {
    const old = nowLine && lineEls.get(nowLine);
    if (old) { old.classList.remove('now'); const te = old.querySelector('.text'); if (te && nowLine) te.textContent = nowLine.text; }
    nowLine = l;
    const el = l && lineEls.get(l);
    if (el) {
      el.classList.add('now');
      // 낱말마다 칠할 수 있게 나눈다
      const te = el.querySelector('.text');
      if (te) te.replaceChildren(...l.text.split(/(\s+)/).map((w) => { const s = document.createElement('span'); s.textContent = w; return s; }));
      // 사용자가 방금 직접 스크롤했으면 화면을 끌고 가지 않는다
      if (Date.now() - userScrollAt > 3000) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }
  const el = l && lineEls.get(l);
  if (!el) return;
  const i = lines.indexOf(l);
  const frac = Math.max(0, Math.min(1, (t - l.t) / Math.max(0.5, lineEnd(i) - l.t)));
  const spans = el.querySelectorAll('.text span');
  const total = l.text.length || 1;
  let acc = 0;
  for (const s of spans) { acc += s.textContent.length; s.classList.toggle('sung', acc / total <= frac + 0.02); }
}

// 화면 갱신마다(부드럽게) 그리고 소리의 시간 이벤트마다(화면이 가려져 갱신이 멈춰도) 맞춘다
function tick() {
  sync();
  cancelAnimationFrame(rafId);
  if (!audioEl.paused) rafId = requestAnimationFrame(tick);
}
audioEl.addEventListener('timeupdate', sync);
function sync() {
  const t = audioEl.currentTime;
  if (stopAt != null && t >= stopAt) { audioEl.pause(); stopAt = null; }
  seekEl.value = t;
  ptimeEl.textContent = `${fmt(t)} / ${fmt(cur.duration)}`;
  let l = null;
  for (const x of lines) { if (x.t <= t + 0.05) l = x; else break; }
  if (editing) l = nowLine; // 고치는 중에는 줄 강조를 옮기지 않는다
  setNowLine(l, t);
}
audioEl.addEventListener('play', () => { playBtn.textContent = '❚❚'; tick(); });
audioEl.addEventListener('pause', () => { playBtn.textContent = '▶'; tick(); });
audioEl.addEventListener('ended', () => { playBtn.textContent = '▶'; });
playBtn.onclick = () => { stopAt = null; audioEl.paused ? audioEl.play() : audioEl.pause(); };
seekEl.oninput = () => { audioEl.currentTime = +seekEl.value; tick(); };
$('#prate').onchange = () => { audioEl.playbackRate = +$('#prate').value; };
transcriptEl.addEventListener('wheel', () => (userScrollAt = Date.now()), { passive: true });
transcriptEl.addEventListener('touchmove', () => (userScrollAt = Date.now()), { passive: true });

// 줄의 시각을 누르면 그곳부터 듣는다
function playFrom(l, onlyThisLine = false) {
  if (playerEl.hidden) return false;
  const i = lines.indexOf(l);
  audioEl.currentTime = Math.max(0, l.t - 0.2);
  stopAt = onlyThisLine && i >= 0 ? lineEnd(i) + 0.2 : null;
  userScrollAt = 0;
  audioEl.play();
  return true;
}

const stampOf = (ms) => { const d = new Date(ms); const z = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`; };

// ---------- 녹음 목록 ----------
const recDlg = $('#recDlg'), recList = $('#recList');
const when = (ms) => new Date(ms).toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: 'numeric', minute: '2-digit' });
async function renderRecList() {
  const all = (await allSessions().catch(() => [])).filter((s) => s.lines?.length || s.duration > 0).sort((a, b) => b.created - a.created);
  recList.replaceChildren(...all.map((s) => {
    const li = document.createElement('li');
    li.innerHTML = '<div class="info"><b class="when"></b> <span class="dur"></span><div class="preview"></div></div>' +
      '<div class="acts"><button data-a="open">열기</button><button data-a="save">저장</button><button data-a="del">삭제</button></div>';
    li.querySelector('.when').textContent = (s.id === cur.id ? '● ' : '') + when(s.created) + (s.name ? ` · ${s.name}` : '');
    li.querySelector('.dur').textContent = s.duration > 0 ? `${fmt(s.duration)} · ${(s.duration * SR * 2 / 1e6).toFixed(1)}MB` : '소리 없음';
    li.querySelector('.preview').textContent = s.lines?.map((l) => l.text).join(' ').slice(0, 80) || '(전사 없음)';
    li.querySelector('[data-a=save]').disabled = !(s.duration > 0);
    li.querySelector('[data-a=open]').disabled = recording;
    li.querySelector('[data-a=open]').onclick = async () => { recDlg.close(); await openSession(s.id); };
    li.querySelector('[data-a=save]').onclick = async () => { const b = await sessionWav(s.id); b && download(b, `녹음-${stampOf(s.created)}.wav`); };
    li.querySelector('[data-a=del]').onclick = async () => {
      if (!confirm(`${when(s.created)} 녹음과 전사를 지울까요? 되돌릴 수 없어요.`)) return;
      await deleteSession(s.id);
      if (s.id === cur.id && !recording) newSession('empty');
      renderRecList();
    };
    return li;
  }));
}
$('#recBtn').onclick = async () => { await renderRecList(); recDlg.showModal(); };
$('#recClose').onclick = () => recDlg.close();

// 예전 버전이 localStorage에 둔 전사 내용을 한 번만 옮겨 온다
async function restoreSessions() {
  try {
    const old = JSON.parse(store.get('transcript', '[]'));
    if (old.length) {
      const id = Date.now() - 1;
      await putSession({ id, created: id, kind: 'text', name: '이전 전사', duration: 0, lines: old.map(({ t, lang, text, fine, edited }) => ({ t, lang, text, fine, edited })) });
      store.set('transcript', '[]');
      store.set('currentSession', String(id));
    }
  } catch {}
  const id = +store.get('currentSession', '0');
  if (id && (await getSession(id).catch(() => null))) await openSession(id);
  else newSession('empty');
}

// ---------- 녹음 ----------
let recording = false, stream, ctx, node;
let segmenter, timerInt, t0, wakeLock, audioFrames = 0, watchdog, session = null;

// 128샘플마다 메시지를 보내면 폰에서 부담이 커서 2048샘플씩 모아 보낸다
const workletSrc = `
class Tap extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Float32Array(2048); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) {
      for (let i = 0; i < ch.length; i++) {
        this.buf[this.n++] = ch[i];
        if (this.n === this.buf.length) { this.port.postMessage(this.buf.slice()); this.n = 0; }
      }
    }
    return true;
  }
}
registerProcessor('tap', Tap);`;

// 기기 기본 샘플레이트(보통 48kHz)를 16kHz로 줄인다. 구간 평균이라 간단한 저역 필터 역할도 한다.
function makeResampler(from, to) {
  const ratio = from / to;
  let acc = 0, cnt = 0, pos = 0; // pos: 다음 출력 샘플 경계까지 남은 입력 샘플 수
  pos = ratio;
  return (input) => {
    const out = new Float32Array(Math.ceil(input.length / ratio) + 1);
    let o = 0;
    for (let i = 0; i < input.length; i++) {
      acc += input[i]; cnt++;
      if (--pos <= 0) { out[o++] = acc / cnt; acc = 0; cnt = 0; pos += ratio; }
    }
    return out.subarray(0, o);
  };
}

async function startRec() {
  // AudioContext는 버튼을 누른 직후에 만들어야 한다. 마이크 권한 창을 거친 뒤에 만들면
  // 안드로이드 크롬에서 '일시정지' 상태로 시작해서 소리가 전혀 들어오지 않는다.
  ctx = new AudioContext();
  const workletUrl = URL.createObjectURL(new Blob([workletSrc], { type: 'application/javascript' }));
  const workletReady = ctx.audioWorklet.addModule(workletUrl);
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (err) {
    ctx.close();
    statusEl.textContent = '마이크 권한이 필요해요: ' + err.message;
    return;
  }
  try { await ctx.resume(); } catch {}
  // 녹음마다 새 세션: 소리와 전사를 함께 보관한다
  newSession('mic');
  playerEl.hidden = true;
  $('#saveAudio').disabled = true;
  startAudioRecord();

  await workletReady;
  const src = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, 'tap');
  const base = 0;
  // 정밀 전사가 켜져 있으면 구간 소리를 모아 두었다가 녹음을 멈출 때 다시 전사한다
  const sess = session = $('#precise').value === 'off' ? null : [];
  if (sess) sess.sid = cur.id;
  // 정밀 전사 모델은 녹음을 멈춘 뒤에 준비한다. 녹음 중에 준비하면 실시간 전사와 CPU를 나눠 써서 느려진다
  segmenter = new Segmenter((s, t) => sendSegment(s, base + t, sess), (s, t) => sendPartial(s, base + t));
  segmenter.level = (rms) => (meterFill.style.width = Math.min(100, rms * 600) + '%');
  const resample = makeResampler(ctx.sampleRate, SR);
  audioFrames = 0;
  // 같은 16kHz 소리를 저장하고 전사에도 쓴다 → 전사 줄의 시각과 녹음 위치가 정확히 맞는다
  node.port.onmessage = (e) => { audioFrames++; const pcm = resample(e.data); recordPcm(pcm); segmenter.push(pcm); };
  // 일부 기기는 출력에 연결된 노드만 처리하므로, 소리 0으로 스피커에 연결해 둔다
  const mute = ctx.createGain();
  mute.gain.value = 0;
  src.connect(node).connect(mute).connect(ctx.destination);

  clearTimeout(watchdog);
  watchdog = setTimeout(async () => {
    if (!recording || audioFrames > 0) return;
    try { await ctx.resume(); } catch {}
    if (audioFrames === 0) statusEl.textContent = `마이크 소리가 들어오지 않아요 (오디오 상태: ${ctx.state}). 녹음 버튼을 다시 눌러 보세요.`;
  }, 3000);

  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}

  recording = true;
  recBtn.classList.add('on');
  $('#fileLabel').style.pointerEvents = 'none'; $('#fileLabel').style.opacity = .4;
  t0 = Date.now();
  timerInt = setInterval(() => (timerEl.textContent = fmt((Date.now() - t0) / 1000)), 250);
  updateQueue();
}

function stopRec() {
  recording = false;
  clearInterval(timerInt);
  clearTimeout(watchdog);
  segmenter?.flush();
  if (session) { runPrecise(session); session = null; }
  node?.disconnect(); ctx?.close();
  flushPcm();
  cur.duration = recTotal / SR;
  persist();
  loadPlayer();
  stream?.getTracks().forEach((t) => t.stop());
  wakeLock?.release?.(); wakeLock = null;
  recBtn.classList.remove('on');
  meterFill.style.width = '0';
  $('#fileLabel').style.pointerEvents = ''; $('#fileLabel').style.opacity = '';
  updateQueue();
}

recBtn.onclick = () => (recording ? stopRec() : startRec());

// 화면이 꺼졌다 켜지면 화면 켜짐 유지를 다시 요청
document.addEventListener('visibilitychange', async () => {
  if (recording && document.visibilityState === 'visible' && !wakeLock) {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  }
});

// ---------- 파일 전사 ----------
$('#file').onchange = async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || !ready) return;
  statusEl.textContent = '파일 읽는 중…';
  try {
    const actx = new AudioContext({ sampleRate: SR });
    const decoded = await actx.decodeAudioData(await file.arrayBuffer());
    actx.close();
    const data = decoded.getChannelData(0);
    const base = 0;
    newSession('file', file.name);
    startAudioRecord();
    for (let i = 0; i < data.length; i += SR * 5) recordPcm(data.subarray(i, i + SR * 5));
    flushPcm();
    cur.duration = data.length / SR;
    persist();
    loadPlayer();
    const sess = $('#precise').value === 'off' ? null : [];
    if (sess) sess.sid = cur.id;
    const seg = new Segmenter((s, t) => sendSegment(s, base + t, sess));
    for (let i = 0; i < data.length; i += SR) seg.push(data.slice(i, i + SR));
    seg.flush();
    if (sess) runPrecise(sess);
  } catch (err) {
    statusEl.textContent = '이 파일은 읽을 수 없어요: ' + err.message;
  }
};

// ---------- 도구 ----------
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');

$('#copy').onclick = async () => {
  try { await navigator.clipboard.writeText(asText()); statusEl.textContent = '복사했어요'; }
  catch { statusEl.textContent = '복사 실패'; }
};
$('#saveTxt').onclick = () => download(new Blob([asText()], { type: 'text/plain;charset=utf-8' }), `전사-${stamp()}.txt`);
$('#saveAudio').onclick = async () => { const b = await sessionWav(cur.id); b && download(b, `녹음-${stampOf(cur.created)}.wav`); };
$('#clear').onclick = async () => {
  if (recording) return;
  if ((lines.length || cur.duration) && !confirm('지금 보고 있는 녹음과 전사를 지울까요? 녹음 목록에서도 지워지고 되돌릴 수 없어요.')) return;
  await deleteSession(cur.id).catch(() => {});
  newSession('empty');
  await loadPlayer();
  updateQueue();
};

$('#lang').value = store.get('lang', 'auto');
$('#model').value = store.get('model', 'onnx-community/whisper-base');
$('#lang').onchange = () => store.set('lang', $('#lang').value);
$('#device').value = store.get('device', 'auto');
$('#device').addEventListener('change', () => { store.set('gpuSlow', ''); gpuFallback = false; });
$('#model').onchange = $('#device').onchange = () => {
  if (recording) stopRec();
  store.set('model', $('#model').value);
  store.set('device', $('#device').value);
  statusEl.textContent = '모델 바꾸는 중…';
  stopPreciseWorker();
  startWorker();
};
$('#precise').value = store.get('precise', 'auto');
if (!$('#precise').value) $('#precise').value = 'auto';
$('#precise').onchange = () => {
  store.set('precise', $('#precise').value);
  stopPreciseWorker(); // 다음에 녹음을 멈출 때 새 설정으로 다시 준비한다
};

restoreSessions().then(updateQueue);
updateQueue();
startWorker();

// 서비스 워커가 붙여 주는 헤더로 'cross-origin isolated'가 되어야 전사 엔진이 CPU 여러 개를 쓴다.
// 처음 설치했거나 서비스 워커가 새로 바뀐 직후에는 아직 헤더가 없으니, 한 번만 새로 고친다.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
    if (window.crossOriginIsolated) { try { sessionStorage.removeItem('coi-reload'); } catch {} return; }
    let tried = false;
    try { tried = sessionStorage.getItem('coi-reload') === '1'; sessionStorage.setItem('coi-reload', '1'); } catch { tried = true; }
    if (!tried && !recording) location.reload();
  }).catch(() => {});
}
</script>
